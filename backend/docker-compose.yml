name: mini-x

services:
  postgres:
    image: postgres:18
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: mini-x
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: