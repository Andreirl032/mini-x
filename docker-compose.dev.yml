name: mini-x-dev

services:
  postgres:
    image: postgres:18
    container_name: mini-x-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: mini-x
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini-x"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: mini-x-backend-dev
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mini-x
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm i && npx prisma generate && npx prisma migrate deploy && npm run dev"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mini-x-frontend-dev
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "npm i && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  postgres-data-dev:
  backend_node_modules:
  frontend_node_modules:
